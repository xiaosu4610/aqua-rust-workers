[package]
name = "aqua-gateway"
version = "0.1.0"
edition = "2021"
description = "AQUA API Gateway - Cloudflare Worker (Rust->Wasm), Nvidia NIM proxy with key rotation"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
worker = { version = "0.8", features = ["d1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"
wasm-bindgen = "0.2"
futures-util = "0.3"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
console_error_panic_hook = { version = "0.1.7", optional = true }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1